name: tests

on:
  push:
  pull_request:

jobs:
  primitives:
    name: consensus primitives (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tests/test_primitives.py -v

  contract:
    name: contract behaviour (genlayer-test direct mode)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_policy_gate_direct.py -v

  lint:
    name: genvm-lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genlayer-test
      - run: |
          genvm-lint check contracts/PolicyGate.py
          genvm-lint check contracts/ExampleGatedAccess.py
