name: GenLayer Contract Checks

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install GenLayer test tooling
        run: pip install -r requirements.txt

      - name: Lint PolicyGate
        run: genvm-lint check PolicyGate.py

      - name: Lint consuming contract
        run: genvm-lint check GatedTreasury.py

      - name: Run pure tests
        run: pytest -q tests
